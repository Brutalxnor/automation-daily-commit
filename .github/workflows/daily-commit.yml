name: Daily contribution update

on:
  workflow_dispatch:
  schedule:
    # Every day at 07:00 Cairo time (~05:00 UTC)
    - cron: "0 5 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update README and Commit
        run: |
          # Define timestamp
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S')
          LINE="Last update: $TIMESTAMP UTC"

          # Update README
          if [ -f README.md ]; then
            if grep -q '^Last update:' README.md; then
              sed -i "s/^Last update:.*/$LINE/" README.md
            else
              echo -e "\n$LINE" >> README.md
            fi
          else
            echo "# Daily Contributions Automation" > README.md
            echo -e "\n$LINE" >> README.md
          fi

          # Git config and commit
          git config user.name "Brutalxnor"
          git config user.email "ahmadhema2015@gmail.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add README.md
          git commit -m "chore: automated daily contribution update ($TIMESTAMP)"
          git push

