name: Daily contribution update

on:
  workflow_dispatch:
  schedule:
    # Every day at 07:00 Cairo time (~05:00 UTC)
    - cron: "0 5 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README timestamp
        run: |
          LINE="Last update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

          if [ -f README.md ]; then
            if grep -q '^Last update:' README.md; then
              # Replace existing Last update line
              sed -i "s/^Last update:.*/$LINE/" README.md
            else
              # Append new Last update line
              echo "" >> README.md
              echo "$LINE" >> README.md
            fi
          else
            echo "$LINE" > README.md
          fi

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Brutalxnor"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add README.md
          git commit -m "chore: daily contribution update"
          git push

